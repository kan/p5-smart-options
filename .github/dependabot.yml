version: 2
updates:
  # Updates the actions of .github/workflows. The PRs also rewrite the entries of
  # .github/workflows/actions.lock. Dependabot has no ecosystem for cpanfile, so the Perl
  # dependencies are not covered here.
  #
  # cooldown: only take a version 3 days after it is published. A broken or hijacked release is
  # usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Moved together with scripts/tagpr/ by git subtree pull, never on its own
      - dependency-name: 'kan/tagpr-scripts*'

  # Updates the base image of the development container (Dockerfile, `FROM perl:5.44`).
  #
  # **Only the Dockerfile is updated.** Dependabot does not read the `container:` images of
  # .github/workflows, so a pull request that moves the Perl version (5.44 to 5.46, say) must also
  # move, by hand: the `perl:<version>` images of test.yml, the `perl-version` of publish.yml, and
  # the volume name in docker-compose.yml (AGENTS.md).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Perl versions with an odd minor number are development releases (perl:5.45, perl:5.45.4).
    # Dependabot already takes a tag newer than `latest` as a pre-release (the run log says so);
    # this list is the second guard, for when it cannot read `latest`. Extend the list when a new
    # development series starts.
    #
    # **Ranges, not `5.45.x`.** The docker ecosystem reads `5.45.x` as the exact version "5.45.x",
    # which no tag is (Gem::Requirement), so it ignored nothing.
    ignore:
      - dependency-name: perl
        versions: [">= 5.45, < 5.46", ">= 5.47, < 5.48", ">= 5.49, < 5.50"]
