version: 2
updates:
  # Updates the actions of .github/workflows. The PRs also rewrite the entries of
  # .github/workflows/actions.lock. Dependabot has no ecosystem for cpanfile, so the Perl
  # dependencies are not covered here.
  #
  # cooldown: only take a version 3 days after it is published. A broken or hijacked release is
  # usually pulled within a few days. Security updates are not delayed by it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns:
          - "*"
    ignore:
      # Moved together with scripts/tagpr/ by git subtree pull, never on its own (#9)
      - dependency-name: 'kan/tagpr-scripts*'

  # Updates the base image of the Dockerfile (the build and test environment).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    # Perl versions with an odd minor number are development releases. Skip them and only take
    # stable releases (even minor). Extend the list when a new development series starts.
    ignore:
      - dependency-name: perl
        versions: ["5.45.x", "5.47.x", "5.49.x"]
