name: tagpr-label

# **Rebuilds the release pull request when a label (`tagpr:major`, say) is added to or removed
# from it,** by starting `tagpr.yml`. What it does is in `scripts/tagpr/README.md` ("Rebuild the
# release pull request when its version label changes"). It checks nothing out, so
# `pull_request_target` runs no code from the pull request.
on:
  pull_request_target:
    types: [labeled, unlabeled]

permissions: {}

jobs:
  rebuild:
    # The same tagpr-scripts commit as `tagpr.yml` and `scripts/tagpr/`; `verify-subtree.mjs` in
    # test.yml checks this line too.
    uses: kan/tagpr-scripts/.github/workflows/tagpr-label.yml@5798ef5c805057f28d47b7b518c2c1d067f55407
    permissions:
      actions: write        # start the tagpr workflow
      pull-requests: write  # mark the release pull request draft
